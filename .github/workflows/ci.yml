name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run no-emdash
      - run: npm run no-vendor-leak
      - run: npm run typecheck
      - run: npx vitest run

  deno:
    # Proves an edge function can import the package: no Node only API in src
    # and every dependency reachable through an npm: specifier.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config deno.json fixtures/deno-check.ts fixtures/edge-function.ts
